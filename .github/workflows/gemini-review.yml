# Advisory Gemini review of each pull request, paid from the organization's Google Cloud trial credit. The shared
# workflow (SoulCraft-Org/.github, gemini-review.yml) holds everything; the organization variable GEMINI_REVIEW=on
# turns it on or off for every repository at once. Its comments are review threads: resolve each before merging.
name: gemini-review

# A pull request that touches none of the paths below has nothing to review, so it skips the run (the Actions tab's
# ci.skip_unchanged_share).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "collectors/**"
      - "tools/**"
      - "tests/**"
      - "catalog/**"
      - "guides/**"
      - "ideals/**"
      - "maps/**"
      - "targets/**"
      - "templates/**"
      - "quality/**"
      - "pack.json"
      - "**/*.md"
      - ".github/workflows/**"

permissions: {}

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: SoulCraft-Org/.github/.github/workflows/gemini-review.yml@fec46ed4e6e63773ea7e300edde97f6e89f98b1f # main, 2026-11-23, public fallback on ubuntu-slim (.github#6)
    permissions:
      contents: read
      id-token: write
      pull-requests: write
