# Advisory Gemini review of each pull request, paid from the organization's Google Cloud trial credit. The shared
# workflow (SoulCraft-Org/.github, gemini-review.yml) holds everything; the organization variable GEMINI_REVIEW=on
# turns it on or off for every repository at once. Its comments are review threads: resolve each before merging.
name: gemini-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: SoulCraft-Org/.github/.github/workflows/gemini-review.yml@8d227d85e95250dcc3c7ad78224328ac63241fbd # main, 2026-11-23, with Plan Mode and subagents off (.github#49)
    permissions:
      contents: read
      id-token: write
      pull-requests: write
