name: pages

# Compute Crafter's public pages, built by Git Crafter's actions/pages at a full commit SHA (Git Crafter
# templates/ci/pages.yml): the Quality page (the 11 library tabs and Credits) and the Process page (the library maps and the Spend map). A pull request builds
# both and runs the privacy gate; only a push to main publishes. A pull request lists the paths the pages read (the doc
# globs among them, for the docs.unmapped gate); every push to main builds, as the pages read live pull requests, issues,
# runs and alerts.
# The build runs in CI mode, so it holds no reading from a maintainer's machine; tests/privacy.mjs checks.
# The build job runs on ubuntu-latest, not ubuntu-slim: the Pages tab's design and usability reads drive Chrome, which
# ubuntu-latest ships and ubuntu-slim does not (Git Crafter pages.yml, visual-check). deploy stays on ubuntu-slim.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "collectors/**"
      - "tools/**"
      - "tests/**"
      - "catalog/**"
      - "guides/**"
      - "ideals/**"
      - "maps/**"
      - "targets/**"
      - "templates/**"
      - "quality/**"
      - "site/**"
      - "pack.json"
      - "**/*.md"
      - ".github/workflows/pages.yml"
      - ".github/workflows/actions.lock"
  workflow_dispatch:

permissions:
  contents: read

# A deploy always finishes; a newer push queues behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Credits collector reads catalog/plans.json from the checkout, and no provider key: CI passes none.
    # The Process page's collector reads this repo's pull requests, runs, checks and issues (Git Crafter
    # actions/pages/action.yml); a read refused is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      # Dependabot's open alerts, read live on every run; without it they come from the last local snapshot.
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The SoulCraft Quality Reader App's installation token. The client ID is the org variable
      # QUALITY_READER_CLIENT_ID and the key is the org secret QUALITY_READER_KEY.
      # It is read-only, one hour long and scoped to this repository.
      # It is minted on main only, so a pull request's code never runs with it.
      # It reads the Settings, Scanning and Projects metrics: settings, alerts and secret names, never values.
      # Code quality is not among the App's permissions, so those reads stay not measured.
      # A missing variable or key fails the step on main, where the App is installed.
      - id: quality-reader
        if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.QUALITY_READER_CLIENT_ID }}
          private-key: ${{ secrets.QUALITY_READER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Read access to these nine permissions, nothing else.
          permission-administration: read
          permission-environments: read
          permission-secrets: read
          permission-secret-scanning-alerts: read
          permission-security-events: read
          permission-vulnerability-alerts: read
          permission-organization-administration: read
          permission-members: read
          permission-organization-projects: read

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: SoulCraft-Org/git-crafter/actions/pages@6899e46174d55abddc0324ee7c61c6f1e3631561 # v7.1.0
        with:
          pages: process quality
          config: quality/process/config.json
          quality-config: quality/config.json
          # On main only, so a pull request builds with none and those metrics read not measured there.
          admin-read-token: ${{ github.ref == 'refs/heads/main' && steps.quality-reader.outputs.token || '' }}

      # The Wiring map: site/map.html reads site/wiring.json. Copied in after the action builds, so the privacy gate
      # below checks it with the rest of quality/dist.
      - name: Add the Wiring map
        run: cp -R site/. quality/dist/

      # The run the page is drawn from: CI mode, no local-only value, no home path or email, no private term.
      # Every file the deploy uploads, quality/dist, gets the same home path and email checks.
      # PRIVACY_TERMS is the org secret PRIVATE_TERMS, one regex (tests/privacy.mjs). A fork's or Dependabot's pull
      # request gets no secret, so the term check notes the skip there; a log line never quotes a match.
      - name: Privacy gate
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: node tests/privacy.mjs quality/data/latest.json targets --dist quality/dist

      # A pull request keeps the page it built for a week, so its score can be read before the merge.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: pages-preview
          path: |
            quality/dist
            quality/data/latest.json
          retention-days: 7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: quality/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
