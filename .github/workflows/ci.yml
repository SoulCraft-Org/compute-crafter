name: ci

# The Git Crafter CI standard (SoulCraft-Org/git-crafter templates/ci/README.md): this repo calls Git Crafter's
# reusable workflow, which runs each job on GitHub's hosted runners. Dependabot's github-actions entry bumps
# the pin, together with the engine pin in pages.yml. paths names what a change must touch to run the jobs; a change to
# any other file (a licence, a CODEOWNERS line) skips them, and ci-ok still reports.
on:
  pull_request:
  workflow_dispatch: # catalog-reread.yml starts CI this way, as a GITHUB_TOKEN pull request starts none
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: SoulCraft-Org/git-crafter/.github/workflows/ci-standard.yml@6899e46174d55abddc0324ee7c61c6f1e3631561 # v7.1.0
    with:
      paths: |
        collectors/**
        tools/**
        tests/**
        catalog/**
        guides/**
        ideals/**
        maps/**
        targets/**
        templates/**
        quality/**
        pack.json
        **/*.md
        .github/workflows/ci.yml
        .github/workflows/pages.yml
        .github/dependabot.yml
      node-version: "26"
      short: |
        python3 -I tools/catalog.py --self-test
        python3 -I tools/catalog.py --check
        python3 -I tools/voice_lint.py --self-test
        git ls-files -z '*.md' | xargs -0 python3 -I tools/voice_lint.py --rules tools/voice_rules.json
        node --test tests/*.test.mjs
        # Fidelity of the moved Credits files, then their own tests beside the engine at this pin (tests/engine-tests.sh).
        # Seconds of work, so it runs in the short job on ubuntu-slim, not in a 2-core standard job.
        bash tests/engine-tests.sh
