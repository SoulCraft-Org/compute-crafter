name: ci

# The Git Crafter CI standard (SoulCraft-Org/git-crafter templates/ci/README.md): this repo calls Git Crafter's
# reusable workflow, which runs each job on GitHub's standard hosted runners. Dependabot's github-actions entry bumps
# the pin.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: SoulCraft-Org/git-crafter/.github/workflows/ci-standard.yml@dd03762898c5cbd816b7a093307c643dcc80a5c3 # v4.0.0
    with:
      paths: ""
      short: |
        python3 -I tools/catalog.py --self-test
        python3 -I tools/catalog.py --check
        python3 -I tools/voice_lint.py --self-test
        git ls-files -z '*.md' | xargs -0 python3 -I tools/voice_lint.py --rules tools/voice_rules.json
