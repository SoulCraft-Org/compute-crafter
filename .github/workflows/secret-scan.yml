name: secret-scan

# SoulCraft-Org starter: calls the organization's shared gitleaks workflow, which scans the whole git history and fails
# on any finding, with secret values redacted in the log. The call is pinned to a full commit SHA; move the pin by hand
# once you have read the newer commit. A false positive goes in .gitleaksignore, one fingerprint per line.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to main always finishes.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    uses: SoulCraft-Org/.github/.github/workflows/gitleaks.yml@c6bd7cd79bf64b6bab497eead1aadb863a90e21f # reviewed commit, 2026-11-23
