name: catalog-reread

# Weekly keyless Claude agent: re-reads the stalest rows of catalog/plans.json and pushes one branch for review. It never
# merges. tools/reread_agent.py runs the Claude Agent SDK, which the plan's monthly API credit pays for. Claude Code
# does not draw on that credit, so anthropics/claude-code-action cannot be used here
# (https://platform.claude.com/docs/en/about-claude/api-credits-for-subscribers, read 2026-11-23).
# Auth is workload identity federation with no key: the script hands the job's OIDC token to Claude Code the way the
# action does. The Console rule pins this file on main, so it can run only after it is merged: use workflow_dispatch.
#
# The agent can read catalog/** and AGENTS.md, fetch pages and edit catalog/plans.json. This workflow, not the agent,
# commits and pushes reread/<date> with GITHUB_TOKEN, then opens an issue with the agent's table and a compare link.
# The org bars Actions from creating pull requests, so the orchestrator opens the PR, and its own push runs CI.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-reread
  cancel-in-progress: false

jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # pushes the reread branch
      issues: write # the hand-off issue
      id-token: write # the OIDC token for federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false # the agent can read files, so no token stays in .git/config

      - name: Install the Agent SDK (hashed pins)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r tools/reread-requirements.txt

      - name: Run the agent
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          unset ANTHROPIC_API_KEY
          "$RUNNER_TEMP/venv/bin/python" -I tools/reread_agent.py

      - name: Push the branch and open the hand-off issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet catalog/plans.json; then
            echo "No row changed, so no branch."
            exit 0
          fi
          python3 -I tools/catalog.py --check
          branch="reread/$(date -u +%F)"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/plans.json
          git commit -s -m "Catalog: re-read stale rows ($(date -u +%F))"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          {
            cat "$RUNNER_TEMP/pr-body.md"
            printf '\n\nCompare: https://github.com/%s/compare/main...%s\n\nThe orchestrator opens the PR; this agent never merges.\n' "$GITHUB_REPOSITORY" "$branch"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "Catalog re-read ready: $branch" --body-file "$RUNNER_TEMP/body.md"
