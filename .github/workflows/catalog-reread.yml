name: catalog-reread

# Weekly keyless Claude agent: re-reads the stalest rows of catalog/plans.json and opens one pull request. It never
# merges. tools/reread_agent.py runs the Claude Agent SDK, which the plan's monthly API credit pays for. Claude Code
# does not draw on that credit, so anthropics/claude-code-action cannot be used here
# (https://platform.claude.com/docs/en/about-claude/api-credits-for-subscribers, read 2026-11-23).
# Auth is workload identity federation with no key: the script hands the job's OIDC token to Claude Code the way the
# action does. The Console rule pins this file on main, so it can run only after it is merged: use workflow_dispatch.
#
# The agent can read, fetch and edit catalog/plans.json. This workflow, not the agent, commits, pushes and opens the
# pull request with GITHUB_TOKEN. Such a pull request starts no workflows, so the last step dispatches ci.yml.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-reread
  cancel-in-progress: false

jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # pushes the reread branch
      pull-requests: write
      actions: write # dispatches ci.yml on that branch
      id-token: write # the OIDC token for federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false # the agent can read files, so no token stays in .git/config

      - name: Install the Agent SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet claude-agent-sdk==0.2.180

      - name: Run the agent
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          unset ANTHROPIC_API_KEY
          "$RUNNER_TEMP/venv/bin/python" -I tools/reread_agent.py

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet catalog/plans.json; then
            echo "No row changed, so no pull request."
            exit 0
          fi
          python3 -I tools/catalog.py --check
          branch="reread/$(date -u +%F)"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/plans.json
          git commit -s -m "Catalog: re-read stale rows ($(date -u +%F))"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          { cat "$RUNNER_TEMP/pr-body.md"; printf '\n\nReview needed: this agent never merges.\n'; } > "$RUNNER_TEMP/body.md"
          gh pr create --head "$branch" --base main --title "Catalog: re-read stale rows ($(date -u +%F))" --body-file "$RUNNER_TEMP/body.md"
          gh workflow run ci.yml --ref "$branch"
