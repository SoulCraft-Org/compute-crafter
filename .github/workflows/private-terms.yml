name: private-terms

# The private half of the private-term rule (tools/private_terms.py). The names this public repo must never contain
# live in the org secret PRIVATE_TERMS, not in tools/voice_rules.json. A fork's or Dependabot's pull request gets no
# secret and only notes the skip; every push to main runs the full scan.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to main always finishes.
concurrency:
  group: private-terms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan every tracked file
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: python3 -I tools/private_terms.py
