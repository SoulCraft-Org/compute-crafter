<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logins board</title>
<!-- Your logins board. Open this file in a browser, then pick board.json (from: bash sheet.sh CATALOG SITES --json
     STATUS > board.json). Nothing is uploaded: the page reads the file in this tab only, and loads nothing. -->
<style>
  :root { --bg: #fffbf3; --panel: #fdf1d8; --fg: #2b1d12; --muted: #6b5a4a; --line: #e8d9bc; --ok: #1f7a4d;
    --todo: #b42318; --na: #b8a98f; --accent: #f0a92b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17120d; --panel: #241c14; --fg: #f6ead6; --muted: #bba78c;
    --line: #3a2e22; --ok: #5fcf95; --todo: #ff8a7a; --na: #6e604e; --accent: #f0a92b; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin: 8px 0 16px; }
  .pick { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px; border: 1px dashed var(--line);
    border-radius: 12px; margin-bottom: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border-radius: 12px; padding: 12px; }
  .tile .k { color: var(--muted); font-size: 13px; }
  .tile .v { font-size: 26px; font-weight: 600; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--ok); }
  @media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .8s ease-out; } }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #2b1d12; border-color: var(--accent); }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  .ok { color: var(--ok); } .todo { color: var(--todo); } .na { color: var(--na); }
  a { color: inherit; }
  .empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<main>
  <h1>🔐 Logins board</h1>
  <div class="pick">
    <label for="file">📂 Pick board.json</label>
    <input id="file" type="file" accept=".json,application/json">
    <span id="msg" class="na">Nothing leaves this tab.</span>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="filters" id="filters"></div>
  <div class="wrap"><table id="table"></table></div>
  <p class="empty" id="empty">Pick a file to see your sites.</p>
</main>
<script>
(() => {
  const CHECKS = [['top', '🚀', 'On top sign-in'], ['email', '✉️', 'Email right'], ['passkey', '🔑', 'Passkey in Passwords'],
    ['codes', '🔢', 'Codes in right app'], ['recovery', '🧾', 'Recovery saved'], ['tested', '✅', 'Tested']];
  const FILTERS = [['all', 'All'], ['todo', '⬜ To do'], ['green', '🟢 Green'], ['root', '🌳 Roots']];
  const ICON = { github: '🐙', apple: '🍎', microsoft: '🪟', google: '🔎', 'email-password': '✉️', 'email-link': '📧',
    passkey: '🔑', sso: '🏢' };
  let rows = [], filter = 'all';
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };

  function tile(key, label, done, total) {
    const t = el('div', null, 'tile');
    t.append(el('div', `${key} ${label}`, 'k'), el('div', total ? `${done} / ${total}` : '·', 'v'));
    const bar = el('div', null, 'bar'), fill = el('i');
    bar.append(fill); t.append(bar);
    requestAnimationFrame(() => { fill.style.width = total ? `${Math.round((100 * done) / total)}%` : '0'; });
    return t;
  }

  function draw() {
    const tiles = document.getElementById('tiles'), table = document.getElementById('table');
    tiles.replaceChildren(); table.replaceChildren();
    document.getElementById('empty').hidden = rows.length > 0;
    if (!rows.length) return;
    const roots = rows.filter((r) => r.root);
    tiles.append(tile('🌳', 'Roots green', roots.filter((r) => r.green).length, roots.length));
    tiles.append(tile('🟢', 'Sites green', rows.filter((r) => r.green).length, rows.length));
    for (const [k, icon, label] of CHECKS) {
      const applies = rows.filter((r) => r.checks[k] != null);
      tiles.append(tile(icon, label, applies.filter((r) => r.checks[k]).length, applies.length));
    }
    const head = el('tr');
    for (const h of ['Site', 'Top', ...CHECKS.map((c) => c[1]), 'Settings']) head.append(el('th', h));
    table.append(head);
    const shown = rows.filter((r) => filter === 'all' || (filter === 'green' ? r.green : filter === 'root' ? r.root : !r.green));
    for (const r of shown) {
      const tr = el('tr');
      tr.append(el('td', `${r.green ? '🟢' : '⬜'} ${r.name}`), el('td', ICON[r.top] || (r.top ? r.top : '?')));
      for (const [k] of CHECKS) {
        const v = r.checks[k];
        tr.append(el('td', v == null ? '·' : v ? '✅' : '⬜', v == null ? 'na' : v ? 'ok' : 'todo'));
      }
      const td = el('td');
      if (typeof r.security_url === 'string' && r.security_url.startsWith('https://')) {
        const a = el('a', 'Open ↗'); a.href = r.security_url; a.target = '_blank'; a.rel = 'noopener noreferrer'; td.append(a);
      } else td.textContent = '·';
      tr.append(td); table.append(tr);
    }
  }

  const bar = document.getElementById('filters');
  for (const [id, label] of FILTERS) {
    const b = el('button', label); b.setAttribute('aria-pressed', String(id === filter));
    b.addEventListener('click', () => { filter = id; for (const x of bar.children) x.setAttribute('aria-pressed', String(x === b)); draw(); });
    bar.append(b);
  }

  document.getElementById('file').addEventListener('change', async (e) => {
    const msg = document.getElementById('msg');
    try {
      const data = JSON.parse(await e.target.files[0].text());
      if (!Array.isArray(data) || data.some((r) => typeof r !== 'object' || !r.checks)) throw new Error('not a board.json');
      rows = data; msg.textContent = `${rows.length} sites`; msg.className = 'ok';
    } catch (err) {
      rows = []; msg.textContent = `Could not read that file: ${err.message}`; msg.className = 'todo';
    }
    draw();
  });
  draw();
})();
</script>
</body>
</html>
