<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Compute Crafter</title>
  <desc id="hero-desc">Open-weight models flow through a provider guide, a sign-in and a spend stop into OpenCode desktop first and Claude Code second.</desc>
  <style>
    .bg { fill: #f6f7f9; }
    .ink { fill: #12161d; }
    .muted { fill: #566070; }
    .chip { fill: #ffffff; stroke: #cfd5de; stroke-width: 2; }
    .chip-t { fill: #12161d; }
    .mid { fill: #e6edf8; stroke: #4a73b8; stroke-width: 2; }
    .mid-t { fill: #12161d; }
    .oc { fill: #0b5fc4; }
    .oc-t { fill: #ffffff; }
    .cc { fill: #ffffff; stroke: #c4572b; stroke-width: 3; }
    .cc-t { fill: #12161d; }
    .flow { stroke: #7b8696; }
    .head { fill: #7b8696; }
    .flow-oc { stroke: #0b5fc4; }
    .head-oc { fill: #0b5fc4; }
    .flow-cc { stroke: #c4572b; }
    .head-cc { fill: #c4572b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e1218; }
      .ink { fill: #eef1f6; }
      .muted { fill: #a3adbc; }
      .chip { fill: #181e28; stroke: #343e4f; }
      .chip-t { fill: #eef1f6; }
      .mid { fill: #1b2740; stroke: #6f97d8; }
      .mid-t { fill: #eef1f6; }
      .oc { fill: #4d94f0; }
      .oc-t { fill: #08101c; }
      .cc { fill: #181e28; stroke: #e38a62; }
      .cc-t { fill: #eef1f6; }
      .flow { stroke: #6a7587; }
      .head { fill: #6a7587; }
      .flow-oc { stroke: #4d94f0; }
      .head-oc { fill: #4d94f0; }
      .flow-cc { stroke: #e38a62; }
      .head-cc { fill: #e38a62; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .flow, .flow-oc, .flow-cc { fill: none; stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="a-oc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head-oc" d="M0 0 10 5 0 10z"/></marker>
    <marker id="a-cc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head-cc" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="bg" width="1280" height="400"/>

  <text class="ink" x="64" y="84" font-size="44" font-weight="700">Compute Crafter</text>
  <text class="muted" x="64" y="122" font-size="22">Open-weight models on free tiers, one spend stop.</text>

  <text class="muted" x="64" y="176" font-size="18" font-weight="600" letter-spacing="1.5">OPEN-WEIGHT MODELS</text>
  <g font-size="22" font-weight="600" text-anchor="middle">
    <rect class="chip" x="64" y="192" width="148" height="48" rx="24"/><text class="chip-t" x="138" y="224">Llama</text>
    <rect class="chip" x="228" y="192" width="148" height="48" rx="24"/><text class="chip-t" x="302" y="224">gpt-oss</text>
    <rect class="chip" x="64" y="254" width="148" height="48" rx="24"/><text class="chip-t" x="138" y="286">Gemma</text>
    <rect class="chip" x="228" y="254" width="148" height="48" rx="24"/><text class="chip-t" x="302" y="286">Qwen</text>
    <rect class="chip" x="64" y="316" width="148" height="48" rx="24"/><text class="chip-t" x="138" y="348">GLM</text>
    <rect class="chip" x="228" y="316" width="148" height="48" rx="24"/><text class="chip-t" x="302" y="348">Mistral</text>
  </g>

  <path class="flow" d="M388 278 C 420 278 430 278 466 278" marker-end="url(#a)"/>

  <rect class="mid" x="474" y="206" width="300" height="144" rx="20"/>
  <g text-anchor="middle">
    <text class="mid-t" x="624" y="248" font-size="24" font-weight="700">Guide</text>
    <text class="mid-t" x="624" y="282" font-size="24" font-weight="700">Sign-in</text>
    <text class="mid-t" x="624" y="316" font-size="24" font-weight="700">Spend stop</text>
  </g>

  <path class="flow-oc" d="M782 262 C 840 262 850 210 906 210" marker-end="url(#a-oc)"/>
  <path class="flow-cc" d="M782 298 C 840 298 850 316 906 316" marker-end="url(#a-cc)"/>

  <rect class="oc" x="914" y="146" width="302" height="128" rx="20"/>
  <g text-anchor="middle">
    <text class="oc-t" x="1065" y="198" font-size="32" font-weight="700">OpenCode</text>
    <text class="oc-t" x="1065" y="234" font-size="22">desktop, first</text>
  </g>

  <rect class="cc" x="914" y="288" width="302" height="84" rx="20"/>
  <g text-anchor="middle">
    <text class="cc-t" x="1065" y="326" font-size="26" font-weight="700">Claude Code</text>
    <text class="muted" x="1065" y="354" font-size="20">Code tab, second</text>
  </g>
</svg>
